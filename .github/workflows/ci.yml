name: alpha-checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 tools/check_site.py
      - run: node --check site/site.js
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  source-and-kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
          cabal-update: false
      - run: python tools/publication.py check
      - run: python tools/docs_lint.py
      - run: python tools/test_tools.py
      - run: python tools/test_formatter.py
      - if: runner.os == 'Linux'
        name: Check optional Red Dune source preservation (no game/platform qualification)
        run: |
          python references/red-dune/tools/test_restore.py
          python references/red-dune/tools/check.py verify
          python tools/test_red_dune.py
      - run: python tools/formatter.py install
      - run: python tools/formatter.py check
      - if: runner.os == 'Linux'
        run: python references/afterlight/scripts/check-cpp-format.py
      - if: runner.os == 'Linux'
        run: python references/afterlight/scripts/test-cpp-format.py
      - run: python tools/test_formatter.py --integration
      - run: python tools/fp_game.py doctor
      - run: python tools/fp_game.py build
      - run: python tools/fp_game.py test
      - run: python tools/test_lantern_api.py
      - run: python tools/test_river_api.py
      - run: python tools/test_station_api.py
      - run: python tools/test_play.py
      - run: node references/paper-circuit/web/controls.test.mjs
      - if: runner.os == 'Linux'
        run: bash references/paper-circuit/test/check-opaque-api.sh
      - run: python research/quantity/check.py check
      - if: runner.os == 'Linux'
        name: Check bounded live-tuning semantics (no performance gate)
        timeout-minutes: 2
        run: python research/live-tuning/check.py
      - run: python tools/test_workspace.py

  afterlight-pure-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
          cabal-update: false
      - run: python references/afterlight/scripts/test-check-core.py
      - run: python references/afterlight/scripts/test-audit-source.py
      - run: python references/afterlight/scripts/audit-source.py
      - run: python references/afterlight/scripts/check-core.py --download

  haskell-design-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/haskell-design
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
      - name: Restore locked editor dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npm run check
      - name: Build native reader and adapters
        run: npm run build
      - name: Test syntax, trusted inference, and cache lifecycle
        run: node --test --test-concurrency=1 dist/tests/core.test.cjs dist/tests/audit.test.cjs dist/tests/reader.test.cjs dist/tests/native.test.cjs

  deploy-page:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [public-page, source-and-kernel, afterlight-pure-core, haskell-design-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Only publish the current main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision exists; skipping this older deployment.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
