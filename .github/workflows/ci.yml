name: alpha-checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-and-kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
          cabal-update: false
      - run: python tools/publication.py check
      - run: python tools/docs_lint.py
      - run: python tools/test_tools.py
      - run: python tools/test_formatter.py
      - run: python tools/formatter.py install
      - run: python tools/formatter.py check
      - run: python tools/test_formatter.py --integration
      - run: python tools/fp_game.py doctor
      - run: python tools/fp_game.py build
      - run: python tools/fp_game.py test
      - run: python tools/test_lantern_api.py
      - run: python tools/test_river_api.py
      - run: python tools/test_station_api.py
      - run: python tools/test_play.py
      - run: node references/paper-circuit/web/controls.test.mjs
      - if: runner.os == 'Linux'
        run: bash references/paper-circuit/test/check-opaque-api.sh
      - run: python research/quantity/check.py check
      - run: python tools/test_workspace.py

  afterlight-pure-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
          cabal-update: false
      - run: python references/afterlight/scripts/test-check-core.py
      - run: python references/afterlight/scripts/audit-source.py
      - run: python references/afterlight/scripts/check-core.py --download

  haskell-design-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/haskell-design
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
      - name: Restore locked editor dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npm run check
      - name: Build native reader and adapters
        run: npm run build
      - name: Test syntax, trusted inference, and cache lifecycle
        run: node --test --test-concurrency=1 dist/tests/core.test.cjs dist/tests/audit.test.cjs dist/tests/reader.test.cjs dist/tests/native.test.cjs
